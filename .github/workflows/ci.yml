name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    name: Format, lint and check Python compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vapoursynth ruff vermin toml
          pip install .

      - name: Format
        run: ruff format --check ./src/awsmfunc
      - name: Lint
        run: ruff check ./src/awsmfunc
      - name: Backwards compatibility
        run: vermin --quiet -vvv --target=3.12- -i 2 --violations ./src/awsmfunc
