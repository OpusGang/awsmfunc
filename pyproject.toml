[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "awsmfunc"
description = "awesome VapourSynth functions"
version = "1.3.5"
license = {text = "MIT"}
authors = [
  { name = "OpusGang" },
]
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
  "VapourSynth >= 74",
  "numpy",
  "vs-rekt >= 1.0.0",
  "vsutil >= 0.7.0"
]

[project.urls]
Homepage = "https://github.com/OpusGang/awsmfunc"

[tool.setuptools.package-data]
awsmfunc = ["py.typed"]

[project.optional-dependencies]
fpng = ["vsfpng"]
dev = ["ruff", "toml"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]
